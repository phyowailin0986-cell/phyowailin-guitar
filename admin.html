<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN V7</title>
<style>body{background:#0a0a0a;color:#fff;font-family:Inter,sans-serif;padding:20px;max-width:600px;margin:auto}input,select,button{width:100%;padding:12px;margin:6px 0;background:#161616;border:1px solid #222;color:#fff;border-radius:8px}button{background:#fff;color:#000;font-weight:700;cursor:pointer}.card{background:#161616;padding:12px;border-radius:10px;margin:8px 0;border:1px solid #222}</style></head><body>
<h2>ADMIN V7 - Live Sync</h2>
<input id="pass" type="password" placeholder="Password: phyowai2026">
<button onclick="login()">Login</button>
<div id="panel" style="display:none">
<input id="title" placeholder="Title"><input id="mm" placeholder="Myanmar Title">
<input id="yt" placeholder="YouTube ID or Link - pYgQ8YUcg3E">
<input id="info" placeholder="Em | 78 BPM | Blues Rock Ballad">
<select id="type"><option value="main">MY SONGS</option><option value="other">OTHER ORIGINALS</option></select>
<button onclick="add()">+ Add to Firebase</button>
<div id="list"></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey:"YOUR_API_KEY", authDomain:"phyowailin-guitar.firebaseapp.com", projectId:"phyowailin-guitar", appId:"YOUR_APP_ID" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
window.login=()=>{ if(pass.value==='phyowai2026'){panel.style.display='block'; load()} else alert('Wrong') }
function cleanYT(u){ let id=u.split('v=')[1]||u.split('/').pop(); return id.split('?')[0].split('&')[0].replace('shorts/',''); }
window.add=async()=>{
let yt=cleanYT(document.getElementById('yt').value);
let data={title:title.value, mm:mm.value, yt:yt, info:info.value, type:type.value};
await addDoc(collection(db,"songs"), data); alert('Live Added!'); load()
}
async function load(){ list.innerHTML=''; const snap=await getDocs(collection(db,"songs")); snap.forEach(d=>{ list.innerHTML+=`<div class="card">${d.data().title} - ${d.data().yt} <button onclick="del('${d.id}')">Delete</button></div>` }) }
window.del=async(id)=>{ await deleteDoc(doc(db,"songs",id)); load() }
</script></body></html>
