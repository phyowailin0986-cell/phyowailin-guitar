<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phyo Wai Lin Guitar Official</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{background:#0f0f0f;color:#fff;padding:20px}
h1{color:#f39c12;text-align:center;margin:20px 0;font-size:2rem}
.header{text-align:center;padding:20px 0;border-bottom:1px solid #222;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;max-width:1200px;margin:0 auto}
.card{background:#1e1e1e;border-radius:12px;overflow:hidden;border:1px solid #333;transition:0.3s}
.card:hover{transform:translateY(-5px);border-color:#f39c12}
.thumb{width:100%;aspect-ratio:16/9;background:#000;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.info{padding:15px}
.title{font-weight:bold;font-size:1.1rem;margin-bottom:5px;color:#f39c12}
.meta{color:#888;font-size:0.9rem}
.loading{text-align:center;padding:40px;color:#888}
.btn{display:inline-block;background:#f39c12;color:#000;padding:10px 20px;border-radius:20px;text-decoration:none;font-weight:bold;margin:10px}
.top{text-align:center;margin-bottom:20px}
</style>
</head>
<body>
<div class="header">
<h1>🎸 PHYO WAI LIN GUITAR OFFICIAL</h1>
<p style="color:#aaa">Myanmar Guitar Chords & Songs | 9+ Songs</p>
<a class="btn" href="admin.html">➕ Add New Song</a>
<p id="count" style="margin-top:10px;color:#888">Loading...</p>
</div>

<div id="songsGrid" class="grid">
<p class="loading">⏳ Firebase ကနေ သီချင်းတွေ ဆွဲနေတယ်...</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAMxAo1IFOLV5iOJm4mdd8MSvy3TbMFfSo",
  authDomain: "phyowailin-guitar.firebaseapp.com",
  projectId: "phyowailin-guitar",
  storageBucket: "phyowailin-guitar.firebasestorage.app",
  messagingSenderId: "402954240690",
  appId: "1:402954240690:web:953982abfcb3866c9cffab"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function getYouTubeId(url){
  if(!url) return "";
  if(url.length===11 &&!url.includes("/")) return url;
  const reg = /(?:youtube\.com\/.*v=|youtu\.be\/|youtube\.com\/shorts\/)([^&\n?#]+)/;
  const m = url.match(reg);
  return m? m[1] : url;
}

async function loadSongs(){
  const grid = document.getElementById('songsGrid');
  const countEl = document.getElementById('count');
  try{
    const q = query(collection(db, "songs"), orderBy("createdAt","desc"));
    const snap = await getDocs(q);

    if(snap.empty){
      grid.innerHTML = "<p class='loading'>သီချင်းမရှိသေးဘူး - Admin မှာ စထည့်ပါ!</p>";
      countEl.innerText = "Songs (0)";
      return;
    }

    let html = "";
    let count = 0;
    snap.forEach(doc=>{
      const s = doc.data();
      const yId = s.youtubeId || getYouTubeId(s.youtubeUrl);
      const thumb = yId? `https://img.youtube.com/vi/${yId}/hqdefault.jpg` : "";
      html += `
      <div class="card">
        <div class="thumb">
          ${thumb? `<img src="${thumb}" loading="lazy">` : `<div style="padding:40px;text-align:center">🎸</div>`}
        </div>
        <div class="info">
          <div class="title">${s.title || "Untitled"}</div>
          <div class="meta">${s.key? "Key: "+s.key+" | " : ""}${s.bpm? "BPM: "+s.bpm : ""}</div>
          <div class="meta" style="margin-top:8px">
            ${yId? `<a href="https://youtu.be/${yId}" target="_blank" style="color:#f39c12">▶️ Watch on YouTube</a>` : ""}
          </div>
        </div>
      </div>`;
      count++;
    });
    grid.innerHTML = html;
    countEl.innerText = `Songs (${count}) - Firebase Connected ✅`;
  }catch(err){
    console.error(err);
    grid.innerHTML = `<p class='loading' style="color:#e74c3c">❌ Error: ${err.message}<br>Firestore Rules ကို Allow လုပ်ထားလား စစ်ပါ!</p>`;
  }
}
loadSongs();
</script>
</body>
</html>
